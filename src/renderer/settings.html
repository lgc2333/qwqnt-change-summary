<setting-section data-title="外显文本">
  <setting-panel>
    <setting-list data-direction="column">
      <setting-item>
        <div>
          <setting-text>图片外显文本</setting-text>
          <setting-text data-type="secondary"
            >会话列表与合并转发中替代「[图片]」的文本，留空保持原生</setting-text
          >
        </div>
        <input
          type="text"
          name="picOutsideText"
          spellcheck="false"
          placeholder="[图片]"
        />
      </setting-item>
      <setting-item>
        <div>
          <setting-text>表情包外显文本</setting-text>
          <setting-text data-type="secondary"
            >替代动画表情的「[动画表情]」与商城表情自身名称，留空保持原生</setting-text
          >
        </div>
        <input
          type="text"
          name="memeOutsideText"
          spellcheck="false"
          placeholder="[动画表情]"
        />
      </setting-item>
    </setting-list>
  </setting-panel>
</setting-section>

<setting-section data-title="关于">
  <setting-panel>
    <setting-list data-direction="column">
      <setting-item>
        <setting-text>版本</setting-text>
        <setting-text data-type="secondary" data-role="version"></setting-text>
      </setting-item>
      <setting-item>
        <setting-text>本仓库</setting-text>
        <setting-link
          data-value="https://github.com/lgc2333/qwqnt-change-summary"
        ></setting-link>
      </setting-item>
      <setting-item>
        <setting-text>原仓库</setting-text>
        <setting-link
          data-value="https://github.com/WJZ-P/LiteLoaderQQNT-Change-Summary"
        ></setting-link>
      </setting-item>
      <setting-item>
        <setting-text
          >本插件移植自 WJZ_P 的 LiteLoaderQQNT-Change-Summary，谨此致谢。</setting-text
        >
      </setting-item>
    </setting-list>
  </setting-panel>
</setting-section>
