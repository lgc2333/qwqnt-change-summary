name: auto-build
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nodejs
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v3

      - name: build
        run: |
          pnpm ci
          pnpm build

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: qwqnt-change-summary.zip
